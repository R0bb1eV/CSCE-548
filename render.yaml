# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: booktracker-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: BookTrackerApi
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SUPABASE_URL
        value: "__SUPABASE_PROJECT_URL__"
      - key: SUPABASE_ANON_KEY
        value: "__SUPABASE_ANON_KEY__"
